# Permission GUI Configuration
# Inspired by SuperiorSkyblock2 design: friendly names, config-driven, no internal IDs shown.
#
# Categories:
#   physical    - block/entity/inventory/item interactions
#   management  - island commands and admin actions

# === Category Selection Screen ===
categories:
  rows: 3
  title: "<dark_gray>» <gradient:#4FC3F7:#0288D1><bold>Permission Categories</bold></gradient>"

  background:
    material: GRAY_STAINED_GLASS_PANE
    display-name: " "

  close:
    slot: 26
    material: BARRIER
    display-name: "<red><bold>Close</bold></red>"
    lore:
      - "<gray>Click to close"

  items:
    physical:
      slot: 11
      material: DIAMOND_PICKAXE
      display-name: "<gold><bold>Physical Permissions</bold></gold>"
      lore:
        - "<gray>Block, entity, inventory and item interactions."
        - "<gray>Examples: break, place, open, drop, pickup..."
        - ""
        - "<yellow>Click to manage"

    management:
      slot: 15
      material: BOOK
      display-name: "<aqua><bold>Management Permissions</bold></aqua>"
      lore:
        - "<gray>Island commands and administrative actions."
        - "<gray>Examples: ban, kick, invite, lock, coop..."
        - ""
        - "<yellow>Click to manage"

# === Role Selection Screen ===
roles:
  rows: 3
  title: "<dark_gray>» <gradient:#4FC3F7:#0288D1><bold>Select Role</bold></gradient> <gray>(%category%)</gray>"

  background:
    material: GRAY_STAINED_GLASS_PANE
    display-name: " "

  back:
    slot: 18
    material: ARROW
    display-name: "<yellow>← Back to Categories"
    lore:
      - "<gray>Return to category selection"

  close:
    slot: 26
    material: BARRIER
    display-name: "<red><bold>Close</bold></red>"
    lore:
      - "<gray>Click to close"

  items:
    OWNER:
      slot: 11
      material: GOLDEN_HELMET
      display-name: "<gold><bold>Owner</bold></gold>"
      lore:
        - "<gray>The island owner."
        - "<gray>Has full control over the island."
        - ""
        - "<yellow>Click to manage permissions"

    CO_OWNER:
      slot: 13
      material: DIAMOND_HELMET
      display-name: "<aqua><bold>Co-Owner</bold></aqua>"
      lore:
        - "<gray>Trusted second-in-command."
        - "<gray>Almost full control."
        - ""
        - "<yellow>Click to manage permissions"

    MODERATOR:
      slot: 15
      material: IRON_HELMET
      display-name: "<white><bold>Moderator</bold></white>"
      lore:
        - "<gray>Can moderate island members."
        - ""
        - "<yellow>Click to manage permissions"

    MEMBER:
      slot: 20
      material: CHAINMAIL_HELMET
      display-name: "<green><bold>Member</bold></green>"
      lore:
        - "<gray>Regular island member."
        - ""
        - "<yellow>Click to manage permissions"

    VISITOR:
      slot: 22
      material: LEATHER_HELMET
      display-name: "<yellow><bold>Visitor</bold></yellow>"
      lore:
        - "<gray>Players visiting the island."
        - ""
        - "<yellow>Click to manage permissions"

    BAN:
      slot: 24
      material: BARRIER
      display-name: "<red><bold>Banned</bold></red>"
      lore:
        - "<gray>Banned players."
        - "<gray>Cannot interact with the island."
        - ""
        - "<yellow>Click to manage permissions"

# === Permission List Screen ===
permission-list:
  rows: 6
  title: "<dark_gray>» <gradient:#4FC3F7:#0288D1><bold>%category% > %role%</bold></gradient> <gray>(Page %page%/%total%)</gray>"
  page-size: 36

  background:
    material: GRAY_STAINED_GLASS_PANE
    display-name: " "

  previous-page:
    slot: 45
    material: ARROW
    display-name: "<yellow>← Previous Page"
    lore:
      - "<gray>Go to the previous page"

  next-page:
    slot: 53
    material: ARROW
    display-name: "<yellow>Next Page →"
    lore:
      - "<gray>Go to the next page"

  back:
    slot: 48
    material: ARROW
    display-name: "<yellow>← Back to Role Selection"
    lore:
      - "<gray>Return to role selection"

  close:
    slot: 50
    material: BARRIER
    display-name: "<red><bold>Close</bold></red>"
    lore:
      - "<gray>Click to close"

  # Permission items - friendly names, NOT internal IDs
  # Each permission has: enabled item, disabled item
  # The key MUST match the NamespacedKey (namespace:key) of the registered permission
  permissions:
    # === Physical Permissions ===
    "skyllia:block.break":
      category: physical
      enabled:
        material: DIAMOND_PICKAXE
        display-name: "<gold>Break Blocks"
        lore:
          - "<green>✓ Enabled"
          - "<gray>Allow this role to break blocks."
          - "<yellow>Click to disable"
      disabled:
        material: DIAMOND_PICKAXE
        display-name: "<gold>Break Blocks"
        lore:
          - "<red>✗ Disabled"
          - "<gray>Allow this role to break blocks."
          - "<yellow>Click to enable"

    "skyllia:block.place":
      category: physical
      enabled:
